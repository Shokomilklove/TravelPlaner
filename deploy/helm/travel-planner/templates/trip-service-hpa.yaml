{{- if .Values.tripService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trip-service
  labels:
    {{- include "tp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trip-service
  minReplicas: {{ .Values.tripService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.tripService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tripService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
