apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: trip-service
    app.kubernetes.io/name: travel-planner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm

spec:
  replicas: 1

  selector:
    matchLabels:
      app: trip-service

  template:
    metadata:
      labels:
        app: trip-service
        app.kubernetes.io/name: travel-planner
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: Helm

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101

      # ------------------------------------------------------------
      # Database migration
      # ------------------------------------------------------------
      initContainers:
        - name: migrate
          image: {{ include "tp.image" (dict "root" . "repo" .Values.tripService.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - sh
            - -c
            - |
              until flask db upgrade; do
                echo "waiting for db..."
                sleep 3
              done

          envFrom:
            - configMapRef:
                name: trip-service-config

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: POSTGRES_DB

            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}

            - name: POSTGRES_PORT
              value: "5432"

            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

      # ------------------------------------------------------------
      # Trip Service
      # ------------------------------------------------------------
      containers:
        - name: trip-service
          image: {{ include "tp.image" (dict "root" . "repo" .Values.tripService.repository) }}
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 5001

          envFrom:
            - configMapRef:
                name: trip-service-config

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: POSTGRES_DB

            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}

            - name: POSTGRES_PORT
              value: "5432"

            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: SECRET_KEY

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: JWT_SECRET_KEY

            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tp.secretName" . }}
                  key: INTERNAL_API_TOKEN

          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
