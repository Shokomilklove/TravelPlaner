{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service
  labels:
    {{- include "tp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Ingress
  ingress:
    # Only the frontend pods and the ingress controller may reach trip-service.
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.tripService.port }}
{{- end }}
